# PAUSADO a proposito: no se publica nada hasta que la app este en la store.
# Deshabilitado desde Actions (disabled_manually), no comentando el cron, para
# que reactivarlo sea un boton: Actions > este workflow > Enable workflow.
name: Publicar serie diaria en Instagram

on:
  schedule:
    # Horario de verano (la serie va de agosto a septiembre, todo CEST = UTC+2).
    # L-V 17:30 UTC = 19:30 Madrid — ventana de entreno del publico de contacto.
    # S-D 09:30 UTC = 11:30 Madrid — pico matinal de fin de semana.
    - cron: "30 17 * * 1-5"
    - cron: "30 9 * * 0,6"
  workflow_dispatch:
    inputs:
      dia:
        description: "Dia concreto de la serie (1-28). Vacio = el que toque hoy."
        required: false
      dry_run:
        description: "Ensayo sin publicar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          cd automatizacion
          python3 publicar.py \
            ${{ inputs.dia && format('--dia {0}', inputs.dia) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Guardar el registro para no repetir publicacion
        if: inputs.dry_run != true
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- automatizacion/registro.json; then
            echo "sin cambios en el registro"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automatizacion/registro.json
          git commit -m "registro: post publicado $(date -u +%Y-%m-%d)"
          git push
